<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay CI/CD Platform</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 700px; margin-bottom: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #2563eb; }
        select, input { width: 100%; padding: 8px; margin: 8px 0 16px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        #terminal { background: #000; color: #4ade80; padding: 15px; border-radius: 6px; font-family: monospace; height: 350px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; border: 1px solid #334155; }
        .hidden { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCd5tCIi25KlVcEysIgbtHL7cRyRyfRd50",
            authDomain: "relay-50f24.firebaseapp.com",
            projectId: "relay-50f24",
            storageBucket: "relay-50f24.firebasestorage.app",
            messagingSenderId: "984599740413",
            appId: "1:984599740413:web:af3d75b53ff440a4aea394",
            measurementId: "G-L51DKYNP2T"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GithubAuthProvider();
        provider.addScope("repo");

        let githubToken = "";
        let idToken = "";

        async function login() {
            try {
                const result = await signInWithPopup(auth, provider);
                const credential = GithubAuthProvider.credentialFromResult(result);
                githubToken = credential.accessToken;
                idToken = await result.user.getIdToken();

                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("deploy-section").classList.remove("hidden");
                document.getElementById("user-name").innerText = `Logged in as: ${result.user.displayName || result.user.email}`;

                // Fetch user's GitHub repositories
                const res = await fetch("https://api.github.com/user/repos?per_page=100&sort=updated", {
                    headers: { Authorization: `Bearer ${githubToken}` }
                });
                const repos = await res.json();

                const repoSelect = document.getElementById("repo-select");
                repoSelect.innerHTML = "";
                repos.forEach(r => {
                    const opt = document.createElement("option");
                    opt.value = r.clone_url;
                    opt.text = `${r.full_name} (${r.default_branch})`;
                    opt.dataset.name = r.name;
                    opt.dataset.branch = r.default_branch;
                    repoSelect.appendChild(opt);
                });
            } catch (err) {
                alert("Login failed: " + err.message);
            }
        }

        async function deploy() {
            const repoSelect = document.getElementById("repo-select");
            const selectedOpt = repoSelect.options[repoSelect.selectedIndex];
            const terminal = document.getElementById("terminal");
            terminal.innerText = "Initiating deployment...\n";

            // 1. Create Project in Backend DB
            const projectRes = await fetch("http://localhost:3000/project", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId: 1,
                    name: selectedOpt.dataset.name,
                    repoUrl: selectedOpt.value,
                    branch: selectedOpt.dataset.branch,
                    runtime: document.getElementById("runtime").value,
                    startCommand: document.getElementById("start-cmd").value,
                    port: parseInt(document.getElementById("port").value, 10)
                })
            });
            const projectData = await projectRes.json();
            const projectId = projectData.project.id;

            terminal.innerText += `Project saved (ID: ${projectId}). Triggering Jenkins build...\n`;

            // 2. Trigger Jenkins Deployment
            const deployRes = await fetch(`http://localhost:3000/project/${projectId}/deploy`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ githubToken })
            });
            const deployData = await deployRes.json();
            const deploymentId = deployData.deploymentId;

            terminal.innerText += `Deployment queued (ID: ${deploymentId}). Connecting to live log stream...\n\n`;

            // 3. Connect to Live Server-Sent Events (SSE) Stream
            const eventSource = new EventSource(`http://localhost:3000/deployment/${deploymentId}/logs`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.log) {
                    terminal.innerText += data.log;
                    terminal.scrollTop = terminal.scrollHeight;
                }
                if (data.finished) {
                    terminal.innerText += `\n\n=== DEPLOYMENT ${data.status} ===\n`;
                    eventSource.close();
                }
            };

            eventSource.onerror = () => {
                eventSource.close();
            };
        }

        document.getElementById("login").addEventListener("click", login);
        document.getElementById("deploy-btn").addEventListener("click", deploy);
    </script>
</head>
<body>
    <h1>🚀 Relay — Self-Service Deployment Platform</h1>

    <div id="auth-section" class="card">
        <p>Authenticate with GitHub via Firebase to access your repositories.</p>
        <button id="login">Log in with GitHub</button>
    </div>

    <div id="deploy-section" class="card hidden">
        <h3 id="user-name"></h3>
        
        <label>Select Repository:</label>
        <select id="repo-select"></select>

        <label>Runtime:</label>
        <select id="runtime">
            <option value="nodejs">Node.js</option>
            <option value="python">Python</option>
        </select>

        <label>Start Command:</label>
        <input id="start-cmd" type="text" value="npm start" />

        <label>Port:</label>
        <input id="port" type="number" value="3000" />

        <button id="deploy-btn">Deploy Now 🚀</button>
    </div>

    <div class="card">
        <h3>Live Build Terminal</h3>
        <div id="terminal">Waiting for deployment to start...</div>
    </div>
</body>
</html>
